[project]
name = "fed-faiss-search"
version = "0.1.0"
description = "Semantic search engine over 198 Federal Reserve speeches using FAISS and sentence-transformers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Codex" }]
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "tqdm>=4.66",
    "boto3>=1.34"
]

[project.scripts]
fed-speech-search = "semantic_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_search"]

[tool.hatch.build.targets.sdist]
include = ["src/semantic_search", "README.md", "pyproject.toml"]

[tool.uv]
dev-dependencies = []
